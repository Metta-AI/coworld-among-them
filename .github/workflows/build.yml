name: Github Actions
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libevdev-dev
      - uses: treeform/setup-nim-action@v6
      - name: Install dependencies
        shell: bash
        run: |
          cd ..
          nimby create
          nimby sync "$GITHUB_WORKSPACE/nimby.lock"
      - run: nim check among_them.nim
      - run: nim r tests/tests.nim
      - name: Native language-player transport tests
        run: |
          nim r -d:ssl players/mod_talks/test/llm_provider_unit.nim
          nim c -d:ssl -o:/tmp/among-native-probe players/mod_talks/test/native_llm_http.nim
          python3 -m pip install 'httpx>=0.27.0' 'anthropic>=1.11.0' mettagrid numpy
          AMONG_NATIVE_PROBE=/tmp/among-native-probe python3 -m unittest discover -s bot-policies/tests -v
